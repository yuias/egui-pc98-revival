[package]
name = "egui-pc98-revival"
version = "0.1.0"
edition = "2024"
# egui 0.36 requires it.
rust-version = "1.95"
description = "PC-98 style theme, bitmap font and widgets for egui"
license = "MIT"
repository = "https://github.com/yuias/egui-pc98-revival"
documentation = "https://docs.rs/egui-pc98-revival"
readme = "README.md"
keywords = ["egui", "theme", "pc-98", "retro", "gui"]
categories = ["gui"]
include = [
  "Cargo.toml", "README.md", "LICENSE", "src/**", "examples/**",
  "assets/fonts/KH-Dot-Kodenmachou-16-Ki-aligned.ttf",
  "assets/fonts/README_KHDotFont.txt",
  "assets/fonts/SIL_Open_Font_License_1.1.txt",
]

[features]
default = ["bundled-font"]
bundled-font = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
egui = "0.36"
unicode-width = "0.2"

[dev-dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }

# winit needs at least one windowing backend on Linux/BSD.
[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }
